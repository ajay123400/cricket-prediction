{% extends "admin/base_admin.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1 class="page-title">Site Settings</h1>

<form method="post" class="post-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Site Name</label>
  <input type="text" name="site_name" value="{{ site_settings.site_name }}">
  <label>Description</label>
  <textarea name="description" rows="3">{{ site_settings.description or '' }}</textarea>
  <label>Telegram URL</label>
  <input type="text" name="telegram_url" value="{{ site_settings.telegram_url or '' }}">
  <label>Contact Email</label>
  <input type="email" name="contact_email" value="{{ site_settings.contact_email or '' }}">
  <div class="form-actions">
    <button class="btn" type="submit" name="action" value="save_settings">Save Settings</button>
  </div>
</form>

<h1 class="page-title">Change Admin Password</h1>
<form method="post" class="post-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Current Password</label>
  <input type="password" name="current_password" autocomplete="current-password">
  <label>New Password</label>
  <input type="password" name="new_password" autocomplete="new-password">
  <label>Confirm New Password</label>
  <input type="password" name="confirm_password" autocomplete="new-password">
  <div class="form-actions">
    <button class="btn" type="submit" name="action" value="change_password">Change Password</button>
  </div>
</form>
{% endblock %}
