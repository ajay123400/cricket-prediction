{% extends "admin/base_admin.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<h1 class="page-title">Categories</h1>

<form method="post" class="inline-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="text" name="name" placeholder="Category name" required>
  <button class="btn" type="submit">Add</button>
</form>

<div class="table-wrap">
<table class="admin-table">
  <thead><tr><th>Name</th><th>Slug</th><th>Posts</th><th>Actions</th></tr></thead>
  <tbody>
  {% for cat in categories %}
    <tr>
      <td>{{ cat.name }}</td>
      <td>{{ cat.slug }}</td>
      <td>{{ cat.posts.count() }}</td>
      <td>
        <form method="post" action="{{ url_for('admin.category_delete', cat_id=cat.id) }}" onsubmit="return confirm('Delete this category?');" style="display:inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="link-btn danger">Delete</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="4">No categories yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
