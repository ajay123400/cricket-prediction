{% extends "base.html" %}
{% block title %}Page Not Found - {{ site_settings.site_name }}{% endblock %}
{% block content %}
<div class="not-found">
  <h1>404</h1>
  <p>{{ message or "The page you're looking for doesn't exist." }}</p>
  <a class="btn" href="{{ url_for('public.home') }}">Back to Home</a>
</div>
{% endblock %}
